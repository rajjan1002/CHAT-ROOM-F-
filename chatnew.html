<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Real-time Chat</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- SockJS + STOMP (compatible with Spring STOMP broker) -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <style>
    /* ───────────────────────────────────────────
       Design tokens
    ─────────────────────────────────────────── */
    :root {
      --sidebar-bg:       #0f0e17;
      --sidebar-fg:       #fffffe;
      --sidebar-sub:      rgba(255,255,255,0.45);
      --sidebar-border:   rgba(255,255,255,0.07);
      --sidebar-hover:    rgba(255,255,255,0.06);
      --sidebar-active:   rgba(111,87,255,0.25);
      --sidebar-accent:   #6f57ff;

      --main-bg:          #fafaf8;
      --main-fg:          #1a1a2e;
      --main-sub:         #9091a4;
      --main-border:      #eeeef0;
      --main-header-bg:   #ffffff;

      --bubble-sent-from: #6f57ff;
      --bubble-sent-to:   #4facfe;
      --bubble-sent-fg:   #ffffff;
      --bubble-recv-bg:   #ffffff;
      --bubble-recv-fg:   #1a1a2e;
      --bubble-recv-border: #e8e8ef;

      --input-bg:         #ffffff;
      --input-border:     #e2e2ea;
      --send-btn:         #6f57ff;
      --send-btn-hover:   #5643e8;

      --online-dot:       #22c55e;
      --typing-color:     #9091a4;
      --shadow-sm:        0 2px 12px rgba(0,0,0,0.06);
      --shadow-md:        0 8px 32px rgba(0,0,0,0.1);
      --shadow-bubble:    0 2px 8px rgba(111,87,255,0.18);

      --radius-sm:        10px;
      --radius-md:        18px;
      --radius-lg:        24px;

      --font-display:     'Playfair Display', Georgia, serif;
      --font-body:        'DM Sans', sans-serif;
      --font-mono:        'DM Mono', monospace;

      --sidebar-w:        300px;
      --header-h:         68px;
      --input-area-h:     80px;
      --transition:       0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --main-bg:          #12111c;
      --main-fg:          #ededf5;
      --main-sub:         #6a6b7e;
      --main-border:      #1e1d30;
      --main-header-bg:   #1a1930;
      --bubble-recv-bg:   #1e1d30;
      --bubble-recv-fg:   #ededf5;
      --bubble-recv-border: #2a2845;
      --input-bg:         #1e1d30;
      --input-border:     #2a2845;
      --shadow-sm:        0 2px 12px rgba(0,0,0,0.3);
      --shadow-md:        0 8px 32px rgba(0,0,0,0.45);
    }

    /* ───────────────────────────────────────────
       Reset & Base
    ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-body);
      background: var(--main-bg);
      color: var(--main-fg);
      display: flex;
      transition: background var(--transition), color var(--transition);
    }

    /* ───────────────────────────────────────────
       JOIN MODAL
    ─────────────────────────────────────────── */
    #join-overlay {
      position: fixed; inset: 0;
      background: rgba(15,14,23,0.85);
      backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    #join-overlay.hidden { display: none; }

    .join-card {
      background: var(--main-bg);
      border-radius: var(--radius-lg);
      padding: 48px 44px;
      width: min(420px, 92vw);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      text-align: center;
      animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    .join-logo {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .join-tagline {
      color: var(--main-sub);
      font-size: 0.9rem;
      font-weight: 400;
      margin-bottom: 32px;
    }

    .join-label {
      display: block;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--main-sub);
      margin-bottom: 8px;
    }

    .join-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--input-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      color: var(--main-fg);
      background: var(--input-bg);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      margin-bottom: 20px;
    }
    .join-input:focus {
      border-color: var(--sidebar-accent);
      box-shadow: 0 0 0 4px rgba(111,87,255,0.12);
    }

    .join-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      color: #fff;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
      box-shadow: 0 4px 20px rgba(111,87,255,0.35);
    }
    .join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(111,87,255,0.45); }
    .join-btn:active { transform: translateY(0); }

    .join-server-row {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .join-server-row .join-input { margin-bottom: 0; flex: 1; font-size: 0.88rem; }

    /* ───────────────────────────────────────────
       APP LAYOUT
    ─────────────────────────────────────────── */
    #app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #app.hidden { display: none; }

    /* ───────────────────────────────────────────
       SIDEBAR
    ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sidebar-border);
      position: relative;
      z-index: 10;
      transition: transform var(--transition);
    }

    .sidebar-header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: var(--header-h);
    }

    .logo-wrap { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(111,87,255,0.45);
      flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--sidebar-fg);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .logo-text em {
      font-style: italic;
      color: var(--sidebar-accent);
    }

    .sidebar-actions { display: flex; gap: 6px; }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--sidebar-sub);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      font-size: 1rem;
    }
    .icon-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-fg); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Search */
    .sidebar-search {
      padding: 14px 18px;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--sidebar-sub);
      pointer-events: none;
      width: 16px; height: 16px;
    }

    .sidebar-search input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: 10px;
      border: 1px solid var(--sidebar-border);
      background: rgba(255,255,255,0.06);
      color: var(--sidebar-fg);
      font-family: var(--font-body);
      font-size: 0.88rem;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }
    .sidebar-search input::placeholder { color: var(--sidebar-sub); }
    .sidebar-search input:focus {
      background: rgba(255,255,255,0.1);
      border-color: var(--sidebar-accent);
    }

    /* Section label */
    .sidebar-section-label {
      padding: 14px 20px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sidebar-sub);
    }

    /* User list */
    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 12px;
    }
    .user-list::-webkit-scrollbar { width: 4px; }
    .user-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
    }
    .user-item:hover { background: var(--sidebar-hover); }
    .user-item.active { background: var(--sidebar-active); }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
      position: relative;
    }

    .avatar-ring {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid var(--sidebar-accent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .user-item.active .avatar-ring { opacity: 1; }

    .online-dot {
      position: absolute;
      bottom: 1px; right: 1px;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--online-dot);
      border: 2px solid var(--sidebar-bg);
      box-shadow: 0 0 6px rgba(34,197,94,0.6);
    }

    .user-info { flex: 1; min-width: 0; }

    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--sidebar-fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-last {
      font-size: 0.78rem;
      color: var(--sidebar-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .unread-badge {
      min-width: 20px; height: 20px;
      background: var(--sidebar-accent);
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      flex-shrink: 0;
    }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 16px 18px;
      border-top: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .me-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      color: #fff;
      flex-shrink: 0;
      position: relative;
    }

    .me-info { flex: 1; min-width: 0; }

    .me-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--sidebar-fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .me-status {
      font-size: 0.72rem;
      color: var(--online-dot);
      font-weight: 500;
    }

    /* ───────────────────────────────────────────
       MAIN CHAT AREA
    ─────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--main-bg);
      min-width: 0;
      transition: background var(--transition);
    }

    /* Chat header */
    .chat-header {
      height: var(--header-h);
      min-height: var(--header-h);
      background: var(--main-header-bg);
      border-bottom: 1px solid var(--main-border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), border-color var(--transition);
      z-index: 5;
    }

    .chat-header-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
      position: relative;
    }

    .chat-header-info { flex: 1; }

    .chat-header-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--main-fg);
    }

    .chat-header-status {
      font-size: 0.78rem;
      color: var(--main-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot-sm {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--online-dot);
      box-shadow: 0 0 5px rgba(34,197,94,0.5);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    .chat-header-actions { display: flex; gap: 4px; }

    .header-icon-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--main-sub);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }
    .header-icon-btn:hover {
      background: rgba(111,87,255,0.1);
      color: var(--sidebar-accent);
    }
    .header-icon-btn svg { width: 18px; height: 18px; }

    /* Connection status banner */
    #conn-banner {
      padding: 8px 20px;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.4s ease;
    }
    #conn-banner.connecting { background: #fef9c3; color: #854d0e; }
    #conn-banner.connected  { background: #dcfce7; color: #166534; animation: fadeOutBanner 1s ease 2s forwards; }
    #conn-banner.disconnected { background: #fee2e2; color: #991b1b; }
    #conn-banner.hidden { display: none; }

    /* Messages */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    .messages-wrap::-webkit-scrollbar { width: 5px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: var(--main-border); border-radius: 4px; }

    /* Date separator */
    .date-sep {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 12px;
    }
    .date-sep::before,
    .date-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--main-border);
    }
    .date-sep span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--main-sub);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.5;
      pointer-events: none;
      text-align: center;
    }
    .empty-state svg { width: 56px; height: 56px; color: var(--main-sub); }
    .empty-state p { font-size: 0.9rem; color: var(--main-sub); max-width: 240px; line-height: 1.6; }

    /* Message row */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 74%;
      animation: msgIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .msg-row.sent { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.recv { align-self: flex-start; }

    .msg-avatar-sm {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .msg-row.sent .msg-avatar-sm { display: none; }

    /* Group consecutive messages: hide avatar except last */
    .msg-row.recv.grouped .msg-avatar-sm {
      visibility: hidden;
    }

    .msg-content { display: flex; flex-direction: column; gap: 2px; }
    .msg-row.sent .msg-content { align-items: flex-end; }
    .msg-row.recv .msg-content { align-items: flex-start; }

    .msg-meta {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--main-sub);
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-meta .sender-name {
      font-weight: 600;
      color: var(--main-fg);
    }

    .bubble {
      padding: 10px 15px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
      max-width: 100%;
    }

    .msg-row.sent .bubble {
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      color: var(--bubble-sent-fg);
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-bubble);
    }

    .msg-row.recv .bubble {
      background: var(--bubble-recv-bg);
      color: var(--bubble-recv-fg);
      border: 1px solid var(--bubble-recv-border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg-time {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      opacity: 0.65;
    }

    /* Typing indicator */
    #typing-row {
      display: none;
      align-self: flex-start;
      align-items: flex-end;
      gap: 8px;
      animation: msgIn 0.25s ease;
    }
    #typing-row.show { display: flex; }

    .typing-bubble {
      background: var(--bubble-recv-bg);
      border: 1px solid var(--bubble-recv-border);
      border-radius: var(--radius-md);
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }

    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--main-sub);
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    /* Input area */
    .input-area {
      min-height: var(--input-area-h);
      padding: 14px 20px;
      background: var(--main-header-bg);
      border-top: 1px solid var(--main-border);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background var(--transition), border-color var(--transition);
    }

    .emoji-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--main-sub);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), transform 0.15s;
      flex-shrink: 0;
    }
    .emoji-btn:hover { background: rgba(111,87,255,0.1); transform: scale(1.1); }

    .msg-input {
      flex: 1;
      padding: 11px 18px;
      border-radius: 22px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      font-family: var(--font-body);
      font-size: 0.93rem;
      color: var(--main-fg);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      resize: none;
    }
    .msg-input::placeholder { color: var(--main-sub); }
    .msg-input:focus {
      border-color: var(--sidebar-accent);
      box-shadow: 0 0 0 4px rgba(111,87,255,0.1);
    }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--bubble-sent-from), var(--bubble-sent-to));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(111,87,255,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 22px rgba(111,87,255,0.5); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 20px; height: 20px; }

    /* ───────────────────────────────────────────
       Emoji Picker
    ─────────────────────────────────────────── */
    .emoji-picker {
      position: absolute;
      bottom: calc(var(--input-area-h) + 8px);
      left: 20px;
      background: var(--main-header-bg);
      border: 1px solid var(--main-border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      width: 260px;
      z-index: 100;
      animation: slideUp 0.2s ease;
    }
    .emoji-picker.show { display: flex; }
    .emoji-picker button {
      font-size: 1.3rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      transition: background 0.1s;
      line-height: 1;
    }
    .emoji-picker button:hover { background: rgba(111,87,255,0.1); }

    /* ───────────────────────────────────────────
       Animations
    ─────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.25); opacity: 0.7; }
    }
    @keyframes fadeOutBanner {
      from { opacity: 1; max-height: 40px; padding: 8px 20px; }
      to   { opacity: 0; max-height: 0; padding: 0; overflow: hidden; }
    }

    /* ───────────────────────────────────────────
       Mobile
    ─────────────────────────────────────────── */
    .mob-menu-btn { display: none; }

    @media (max-width: 720px) {
      :root { --sidebar-w: 100vw; }

      .sidebar {
        position: fixed;
        top: 0; left: 0;
        height: 100%;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar.open { transform: translateX(0); }

      .mob-menu-btn { display: flex; }

      .msg-row { max-width: 88%; }
    }

    /* ───────────────────────────────────────────
       Avatar color palette
    ─────────────────────────────────────────── */
    .av-0 { background: #6f57ff; color: #fff; }
    .av-1 { background: #f59e0b; color: #fff; }
    .av-2 { background: #10b981; color: #fff; }
    .av-3 { background: #ef4444; color: #fff; }
    .av-4 { background: #8b5cf6; color: #fff; }
    .av-5 { background: #06b6d4; color: #fff; }
    .av-6 { background: #f97316; color: #fff; }
    .av-7 { background: #ec4899; color: #fff; }
  </style>
</head>
<body>

<!-- ╔══════════════════════════════╗ -->
<!-- ║        JOIN OVERLAY          ║ -->
<!-- ╚══════════════════════════════╝ -->
<div id="join-overlay">
  <div class="join-card">
    <div class="join-logo">Aura</div>
    <p class="join-tagline">Real-time anonymous chat. No account needed.</p>

    <label class="join-label" for="username-input">Your display name</label>
    <input
      id="username-input"
      class="join-input"
      type="text"
      placeholder="e.g. Alex, Pixel, Ghost…"
      maxlength="24"
      autocomplete="off"
    />



    <button class="join-btn" id="join-btn">Enter the Room →</button>
  </div>
</div>

<!-- ╔══════════════════════════════╗ -->
<!-- ║          MAIN APP            ║ -->
<!-- ╚══════════════════════════════╝ -->
<div id="app" class="hidden">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-wrap">
        <div class="logo-icon">✦</div>
        <div class="logo-text">A<em>u</em>ra</div>
      </div>
      <div class="sidebar-actions">
        <button class="icon-btn" id="dark-toggle" title="Toggle theme">
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="sidebar-search">
      <div class="search-wrap">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search participants…" />
      </div>
    </div>

    <div class="sidebar-section-label">Participants</div>
    <div class="user-list" id="user-list">
      <!-- Populated by JS -->
    </div>

    <div class="sidebar-footer">
      <div class="me-avatar" id="me-avatar">?</div>
      <div class="me-info">
        <div class="me-name" id="me-name">You</div>
        <div class="me-status">● Online</div>
      </div>
      <button class="icon-btn" id="logout-btn" title="Change name" style="margin-left:auto">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── MAIN CHAT ── -->
  <main class="chat-area">
    <header class="chat-header">
      <!-- Mobile menu -->
      <button class="header-icon-btn mob-menu-btn" id="mob-menu-btn" title="Participants">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="chat-header-avatar av-0" id="chat-header-avatar">🌐</div>
      <div class="chat-header-info">
        <div class="chat-header-name">Global Lounge</div>
        <div class="chat-header-status">
          <span class="status-dot-sm"></span>
          <span id="online-count">1 online</span>
        </div>
      </div>

      <div class="chat-header-actions">
        <button class="header-icon-btn" title="Members" id="members-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Connection banner -->
    <div id="conn-banner" class="hidden connecting">
      <span id="conn-banner-text">Connecting…</span>
    </div>

    <!-- Messages -->
    <div class="messages-wrap" id="messages-wrap">
      <div class="empty-state" id="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>No messages yet. Say hi to get the conversation started! 👋</p>
      </div>

      <!-- Typing row -->
      <div id="typing-row">
        <div class="msg-avatar-sm av-3" id="typing-avatar">?</div>
        <div class="typing-bubble">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <!-- Emoji picker -->
    <div class="emoji-picker" id="emoji-picker"></div>

    <!-- Input area -->
    <div class="input-area">
      <button class="emoji-btn" id="emoji-toggle" title="Emoji">😊</button>
      <input
        type="text"
        class="msg-input"
        id="msg-input"
        placeholder="Type a message…"
        autocomplete="off"
        maxlength="500"
        disabled
      />
      <button class="send-btn" id="send-btn" disabled title="Send">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // ── State ──────────────────────────────────────────
  let stompClient  = null;
  let myUsername   = '';
  let participants = {};   // { name: { color, lastMsg, unread } }
  let typingTimer  = null;
  let isTyping     = false;
  let msgIdCounter = 1;
  let lastDateShown = null;

  const EMOJIS = ['😀','😂','😍','🤔','😎','🥳','😢','😡','👍','👎',
                  '❤️','🔥','✨','🎉','💯','🙏','👀','💬','🚀','⚡',
                  '😮','🤣','😅','😏','🥺','😤','💪','🌈','🎵','🍕'];

  const AV_COLORS = 8; // number of av-N classes

  // ── DOM refs ───────────────────────────────────────
  const SERVER_URL     = 'https://chat-room-production-67ef.up.railway.app/chat';

  const joinOverlay    = document.getElementById('join-overlay');
  const joinBtn        = document.getElementById('join-btn');
  const usernameInput  = document.getElementById('username-input');
  const appEl          = document.getElementById('app');
  const msgInput       = document.getElementById('msg-input');
  const sendBtn        = document.getElementById('send-btn');
  const messagesWrap   = document.getElementById('messages-wrap');
  const emptyState     = document.getElementById('empty-state');
  const connBanner     = document.getElementById('conn-banner');
  const connBannerText = document.getElementById('conn-banner-text');
  const userList       = document.getElementById('user-list');
  const searchInput    = document.getElementById('search-input');
  const meAvatar       = document.getElementById('me-avatar');
  const meName         = document.getElementById('me-name');
  const onlineCount    = document.getElementById('online-count');
  const darkToggle     = document.getElementById('dark-toggle');
  const themeIconMoon  = document.getElementById('theme-icon-moon');
  const themeIconSun   = document.getElementById('theme-icon-sun');
  const typingRow      = document.getElementById('typing-row');
  const typingAvatar   = document.getElementById('typing-avatar');
  const emojiToggle    = document.getElementById('emoji-toggle');
  const emojiPicker    = document.getElementById('emoji-picker');
  const mobMenuBtn     = document.getElementById('mob-menu-btn');
  const sidebar        = document.getElementById('sidebar');

  // ── Helpers ────────────────────────────────────────
  function avatarClass(name) {
    let hash = 0;
    for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) & 0xffff;
    return 'av-' + (hash % AV_COLORS);
  }

  function initials(name) {
    return name.split(' ').map(p => p[0]).join('').toUpperCase().slice(0,2) || '?';
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(date) {
    const now = new Date();
    const diff = Math.floor((now - date) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return date.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function updateOnlineCount() {
    const n = Object.keys(participants).length + 1;
    onlineCount.textContent = n + ' online';
  }

  // ── Emoji picker ───────────────────────────────────
  EMOJIS.forEach(em => {
    const btn = document.createElement('button');
    btn.textContent = em;
    btn.onclick = () => {
      msgInput.value += em;
      msgInput.focus();
    };
    emojiPicker.appendChild(btn);
  });

  emojiToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    emojiPicker.classList.toggle('show');
  });

  document.addEventListener('click', () => emojiPicker.classList.remove('show'));
  emojiPicker.addEventListener('click', e => e.stopPropagation());

  // ── Theme toggle ───────────────────────────────────
  darkToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeIconMoon.style.display = isDark ? '' : 'none';
    themeIconSun.style.display  = isDark ? 'none' : '';
  });

  // ── Mobile menu ────────────────────────────────────
  mobMenuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !mobMenuBtn.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });

  // ── Sidebar search ─────────────────────────────────
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('.user-item').forEach(el => {
      const name = el.dataset.name.toLowerCase();
      el.style.display = name.includes(q) ? '' : 'none';
    });
  });

  // ── Add/update participant in sidebar ──────────────
  function upsertParticipant(name, lastMsg) {
    if (name === myUsername) return;

    const existing = participants[name];
    if (!existing) {
      participants[name] = { color: avatarClass(name), lastMsg: lastMsg || '', unread: 0 };
    } else {
      existing.lastMsg = lastMsg || existing.lastMsg;
    }

    renderUserList();
    updateOnlineCount();
  }

  function renderUserList() {
    userList.innerHTML = '';
    const entries = Object.entries(participants);
    if (entries.length === 0) {
      userList.innerHTML = '<div style="padding:20px 12px; color:rgba(255,255,255,0.3); font-size:0.82rem; text-align:center;">No other participants yet</div>';
      return;
    }
    entries.forEach(([name, data]) => {
      const item = document.createElement('div');
      item.className = 'user-item';
      item.dataset.name = name;
      item.innerHTML = `
        <div class="avatar ${data.color}">
          ${initials(name)}
          <div class="avatar-ring"></div>
          <div class="online-dot"></div>
        </div>
        <div class="user-info">
          <div class="user-name">${escHtml(name)}</div>
          <div class="user-last">${escHtml(data.lastMsg || 'Active now')}</div>
        </div>
        ${data.unread > 0 ? `<div class="unread-badge">${data.unread}</div>` : ''}
      `;
      userList.appendChild(item);
    });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Message rendering ──────────────────────────────
  function addMessage(msg) {
    const isSent = msg.sender === myUsername;
    const now    = new Date();

    // Hide empty state
    emptyState.style.display = 'none';

    // Date separator
    const dateLabel = formatDate(now);
    if (dateLabel !== lastDateShown) {
      lastDateShown = dateLabel;
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.innerHTML = `<span>${dateLabel}</span>`;
      messagesWrap.insertBefore(sep, typingRow);
    }

    // Check grouping (same sender consecutive)
    const rows = messagesWrap.querySelectorAll('.msg-row');
    const lastRow = rows[rows.length - 1];
    const isGrouped = lastRow && lastRow.dataset.sender === msg.sender;

    const row = document.createElement('div');
    row.className = `msg-row ${isSent ? 'sent' : 'recv'}${isGrouped ? ' grouped' : ''}`;
    row.dataset.sender = msg.sender;

    const avClass = isSent ? avatarClass(myUsername) : avatarClass(msg.sender);

    row.innerHTML = `
      <div class="msg-avatar-sm ${avClass}">${initials(msg.sender)}</div>
      <div class="msg-content">
        ${!isGrouped ? `<div class="msg-meta">
          <span class="sender-name">${isSent ? 'You' : escHtml(msg.sender)}</span>
          <span class="msg-time">${formatTime(now)}</span>
        </div>` : ''}
        <div class="bubble">${escHtml(msg.content)}</div>
        ${isGrouped ? `<div class="msg-meta"><span class="msg-time">${formatTime(now)}</span></div>` : ''}
      </div>
    `;

    messagesWrap.insertBefore(row, typingRow);
    scrollToBottom();

    // Update sidebar last message for sender
    if (!isSent) {
      upsertParticipant(msg.sender, msg.content.slice(0, 36) + (msg.content.length > 36 ? '…' : ''));
    }
  }

  function scrollToBottom(smooth) {
    messagesWrap.scrollTo({ top: messagesWrap.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  // ── Typing indicator ───────────────────────────────
  let typingTimeout = null;
  let currentTyper  = null;

  function showTyping(name) {
    currentTyper = name;
    typingAvatar.textContent = initials(name);
    typingAvatar.className   = 'msg-avatar-sm ' + avatarClass(name);
    typingRow.classList.add('show');
    scrollToBottom(true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => typingRow.classList.remove('show'), 3000);
  }

  // ── Connection banner ──────────────────────────────
  function setBanner(state, text) {
    connBanner.className = state;
    connBannerText.textContent = text;
  }

  // ── WebSocket connect ──────────────────────────────
  function connect(serverUrl) {
    setBanner('connecting', '⚡ Connecting to server…');
    connBanner.classList.remove('hidden');

    const socket = new SockJS(serverUrl);
    stompClient  = Stomp.over(socket);
    stompClient.debug = null; // silence debug logs

    stompClient.connect(
      {},
      function onConnect() {
        setBanner('connected', '✓ Connected');

        // Enable input
        msgInput.disabled = false;
        sendBtn.disabled  = false;
        msgInput.focus();

        // Subscribe to messages
        stompClient.subscribe('/topic/messages', function (frame) {
          try {
            const msg = JSON.parse(frame.body);
            if (msg.content && msg.content.startsWith('__typing__:')) {
              const typer = msg.content.replace('__typing__:', '').trim();
              if (typer !== myUsername) showTyping(typer);
            } else {
              addMessage(msg);
              typingRow.classList.remove('show');
            }
          } catch (e) {
            console.error('Parse error:', e);
          }
        });

        // Announce join
        sendRaw({ sender: myUsername, content: `👋 ${myUsername} joined the room!`, id: msgIdCounter++ });
      },
      function onError(err) {
        console.error('STOMP error:', err);
        setBanner('disconnected', '✗ Connection lost. Refresh to reconnect.');
        msgInput.disabled = true;
        sendBtn.disabled  = true;
        setTimeout(() => connect(serverUrl), 5000);
      }
    );
  }

  function sendRaw(msg) {
    if (!stompClient || !stompClient.connected) return;
    stompClient.send('/app/sendMessage', {}, JSON.stringify(msg));
  }

  // ── Send message ───────────────────────────────────
  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !stompClient || !stompClient.connected) return;

    sendRaw({ id: msgIdCounter++, sender: myUsername, content: text });
    msgInput.value = '';
    msgInput.focus();
    isTyping = false;
  }

  sendBtn.addEventListener('click', sendMessage);

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Typing indicator broadcast
  msgInput.addEventListener('input', () => {
    if (!isTyping && msgInput.value.length > 0) {
      isTyping = true;
      sendRaw({ id: 0, sender: myUsername, content: `__typing__:${myUsername}` });
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { isTyping = false; }, 2000);
    if (!msgInput.value) isTyping = false;
  });

  // ── Join logic ─────────────────────────────────────
  function enterChat(name) {
    myUsername = name;
    localStorage.setItem('aura_username', name);

    meAvatar.textContent  = initials(name);
    meAvatar.className    = 'me-avatar ' + avatarClass(name);
    meName.textContent    = name;
    document.getElementById('chat-header-avatar').textContent = '🌐';

    joinOverlay.classList.add('hidden');
    appEl.classList.remove('hidden');

    connect(SERVER_URL);
  }

  function handleJoin() {
    const name = usernameInput.value.trim();
    if (!name) { usernameInput.focus(); shake(usernameInput); return; }
    enterChat(name);
  }

  function shake(el) {
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'shakeX 0.35s ease';
    el.addEventListener('animationend', () => el.style.animation = '', { once: true });
  }

  joinBtn.addEventListener('click', handleJoin);
  usernameInput.addEventListener('keydown', e => e.key === 'Enter' && handleJoin());

  // ── Auto-rejoin on refresh ─────────────────────────
  const savedName = localStorage.getItem('aura_username');
  if (savedName) {
    enterChat(savedName);
  } else {
    usernameInput.focus();
  }

  // ── Logout / change name ──────────────────────────
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('aura_username');
    if (stompClient && stompClient.connected) stompClient.disconnect();
    location.reload();
  });

  // ── Inject shakeX animation ────────────────────────
  const styleEl = document.createElement('style');
  styleEl.textContent = `@keyframes shakeX {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }`;
  document.head.appendChild(styleEl);

  // ── Prevent closing emoji on emoji-picker scroll ───
  emojiPicker.addEventListener('click', e => e.stopPropagation());

})();
</script>
</body>
</html>
